<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample Browser</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #151515; --panel: #1e1e1e; --raised: #2a2a2a; --line: #303030; --line-strong: #444;
      --text: #ddd; --muted: #8a8a8a; --accent: #F7C449; --error: #f08c74;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, Helvetica, sans-serif;
           display: flex; flex-direction: column; overflow: hidden; user-select: none; }
    button, select, input { font: inherit; color: inherit; }
    button, select { background: var(--raised); border: 1px solid var(--line-strong); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
    button:disabled, select:disabled { opacity: .45; cursor: default; }
    button:not(:disabled):hover { border-color: #666; }

    .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .icon-btn { width: 28px; padding: 3px 0; }
    #add { white-space: nowrap; }
    #search { flex: 1; min-width: 0; background: #101010; border: 1px solid var(--line-strong); border-radius: 5px; padding: 4px 8px; user-select: text; }
    #search:focus { outline: none; border-color: var(--accent); }

    #list { flex: 1; overflow-y: auto; margin: 0; padding: 2px 0; list-style: none; outline: none; }
    #list li { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; cursor: default; border-left: 2px solid transparent; }
    #list li.root { height: 28px; font-weight: 600; border-top: 1px solid var(--line); }
    #list li.root:first-child { border-top: 0; }
    #list li.note { color: var(--muted); font-style: italic; font-size: 12px; }
    #list li.note.error { color: var(--error); font-style: normal; }
    #list .where { flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; color: var(--muted); font-size: 11px; }
    #list li:hover { background: #1c1c1c; }
    #list li.selected { background: #262626; }
    #list:focus li.selected { background: #2f2a1c; border-left-color: var(--accent); }
    #list li.playing .icon, #list li.playing .name { color: var(--accent); }
    #list li.dragging { opacity: .5; }
    #list li[draggable=true] { cursor: grab; }
    #list .icon { width: 1em; text-align: center; color: var(--muted); flex: none; }
    #list li.folder .icon { color: #aaa; }
    #list .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #list .row-btn { flex: none; width: 22px; height: 20px; padding: 0; line-height: 1; visibility: hidden; font-weight: 400; }
    #list li:hover .row-btn, #list li.selected .row-btn { visibility: visible; }
    #list li.empty { color: var(--muted); justify-content: center; height: auto; padding: 24px 12px; text-align: center; }

    #preview { border-top: 1px solid var(--line); background: var(--panel); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .preview-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    #preview-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    #preview-info { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .wave-box { position: relative; height: 56px; background: #101010; border-radius: 4px; overflow: hidden; }
    #wave { --wave: #c9a23c; display: block; width: 100%; height: 100%; cursor: pointer; }
    #playhead { position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: #fff; visibility: hidden; pointer-events: none; will-change: transform; }
    .controls { display: flex; align-items: center; gap: 10px; }
    #play { width: 32px; }
    .controls label { display: flex; align-items: center; gap: 5px; color: var(--muted); }
    #volume { flex: 1; max-width: 140px; accent-color: var(--accent); }

    #status { padding: 4px 8px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status.error { color: var(--error); }

    body.drop-hot::after { content: 'Drop samples or a folder'; position: fixed; inset: 6px; border: 2px dashed var(--accent); border-radius: 8px;
      background: rgba(21, 21, 21, .85); display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 600; pointer-events: none; }
  </style>
</head>
<body>
  <div class="bar">
    <input id="search" type="search" placeholder="Search all folders (/)" spellcheck="false" autocomplete="off" aria-label="Search">
    <button id="collapse" class="icon-btn" title="Collapse all">⊟</button>
    <button id="refresh" class="icon-btn" disabled title="Read the folders again">↻</button>
    <button id="add" disabled title="Add a folder of samples">+ Folder</button>
  </div>
  <ul id="list" tabindex="0" role="tree" aria-label="Folders and samples"></ul>
  <section id="preview">
    <div class="preview-head"><span id="preview-name"></span><span id="preview-info"></span></div>
    <div class="wave-box"><canvas id="wave" title="Click to play from here"></canvas><div id="playhead"></div></div>
    <div class="controls">
      <button id="play" title="Play (Enter)">▶</button>
      <label title="Play each sample as you move to it"><input id="autoplay" type="checkbox" checked> Auto-play</label>
      <label>Vol <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    </div>
  </section>
  <div id="status" role="status">Connecting…</div>
  <script src="vendor/luna.global.js"></script>
  <!-- The bundle npm run build writes from src/: one classic script, never a module script. -->
  <script src="dist/main.js"></script>
</body>
</html>
